<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر مكتب القزاز للبرمجيات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz4Vu2-04TRBOz4OaQy9Bq7XEge08hNfo",
      authDomain: "elkazzaz-store.firebaseapp.com",
      projectId: "elkazzaz-store",
      storageBucket: "elkazzaz-store.firebasestorage.app",
      messagingSenderId: "383296417502",
      appId: "1:383296417502:web:6de10a7f513b8148a81c4f",
      measurementId: "G-GB1YM2MVP9"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.firebaseFns = { collection, addDoc, deleteDoc, doc, onSnapshot };
      window.dispatchEvent(new Event('firebase-ready'));
      console.log("Firebase Connected Successfully!");
    } catch (error) {
      alert("خطأ في اتصال فايربيس: " + error.message);
    }
  </script>

  <script type="text/babel">
    function App() {
      const [view, setView] = React.useState('store');
      const [products, setProducts] = React.useState([]);
      const [cart, setCart] = React.useState([]);
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [passInput, setPassInput] = React.useState('');
      const [newProd, setNewProd] = React.useState({ name: '', price: '', stock: '', category: 'إلكترونيات', image: '', description: '' });
      const [toast, setToast] = React.useState(null);
      const [isDbReady, setIsDbReady] = React.useState(false);

      const showMsg = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 4000);
      };

      React.useEffect(() => {
        const handleReady = () => {
          if (!window.db) return;
          const { collection, onSnapshot } = window.firebaseFns;
          try {
            onSnapshot(collection(window.db, 'products'), (snapshot) => {
              const prods = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
              setProducts(prods);
              setIsDbReady(true);
            }, (err) => {
              showMsg("خطأ في قراءة القاعدة: " + err.message);
            });
          } catch(e) {
            showMsg("خطأ تشغيل السحابة: " + e.message);
          }
        };

        if (window.db) {
          handleReady();
        } else {
          window.addEventListener('firebase-ready', handleReady);
        }
      }, []);

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!newProd.name || !newProd.price) return;
        try {
          const { collection, addDoc } = window.firebaseFns;
          await addDoc(collection(window.db, 'products'), {
            name: newProd.name,
            price: Number(newProd.price),
            stock: Number(newProd.stock || 10),
            category: newProd.category,
            image: newProd.image || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&q=80',
            description: newProd.description,
            createdAt: new Date().toISOString()
          });
          setNewProd({ name: '', price: '', stock: '', category: 'إلكترونيات', image: '', description: '' });
          showMsg('تم الحفظ في السحابة بنجاح 🚀');
        } catch (err) {
          alert('فشل الحفظ بسبب: ' + err.message);
        }
      };

      const handleDelete = async (id) => {
        if (confirm('هل تريد حذف هذا المنتج؟')) {
          const { deleteDoc, doc } = window.firebaseFns;
          await deleteDoc(doc(window.db, 'products', id));
          showMsg('تم الحذف بنجاح');
        }
      };

      return (
        <div className="min-h-screen pb-16">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl">
              {toast}
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 p-4 shadow-sm">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div>
                <h1 className="font-bold text-slate-900 text-base">متجر مكتب القزاز للبرمجيات</h1>
                <p className="text-[11px] text-emerald-600 font-medium">مزامنة سحابية لحظية 🟢</p>
              </div>
              <button 
                onClick={() => setView(view === 'store' ? 'admin' : 'store')}
                className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md"
              >
                {view === 'store' ? '🔒 لوحة التحكم' : '🛍️ العرض للمشتري'}
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-4 mt-4">
            {!isDbReady ? (
              <div className="text-center py-20 text-slate-400 font-bold">جاري الاتصال بقاعدة البيانات...</div>
            ) : view === 'store' ? (
              <div>
                <h2 className="text-xl font-black text-slate-900 mb-4">المنتجات المتاحة أونلاين</h2>
                {products.length === 0 ? (
                  <div className="text-center py-12 bg-white rounded-2xl border shadow-sm">
                    <p className="text-xs text-slate-500 mb-3">لا توجد منتجات مسجلة حالياً بالسحابة.</p>
                    <button onClick={() => setView('admin')} className="bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-bold">إضافة أول منتج</button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {products.map(p => (
                      <div key={p.id} className="bg-white rounded-2xl border p-4 shadow-sm flex flex-col justify-between">
                        <div>
                          <img src={p.image} className="w-full h-40 object-cover rounded-xl mb-3" />
                          <h3 className="font-bold text-slate-900 text-sm">{p.name}</h3>
                          <p className="text-xs text-slate-500 mt-1">{p.description}</p>
                        </div>
                        <div className="flex items-center justify-between border-t pt-3 mt-3">
                          <span className="font-black text-amber-600 text-base">{p.price} ج.م</span>
                          <button onClick={() => { setCart([...cart, p]); showMsg(`تمت إضافة ${p.name}`); }} className="bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold">إضافة للسلة</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div className="max-w-md mx-auto bg-white p-6 rounded-3xl border shadow-xl">
                {!isAdmin ? (
                  <div className="text-center py-6 space-y-3">
                    <h2 className="font-bold text-base">دخول لوحة تحكم المدير</h2>
                    <p className="text-xs text-slate-400">كلمة السر: admin123</p>
                    <input type="password" placeholder="أدخل كلمة السر" value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full p-3 rounded-xl border text-center font-bold text-sm" />
                    <button onClick={() => passInput === 'admin123' ? setIsAdmin(true) : showMsg('كلمة السر خاطئة')} className="w-full bg-amber-500 text-white py-3 rounded-xl font-bold text-xs">دخول</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center border-b pb-2">
                      <h2 className="font-bold text-sm">إضافة منتج سحابي جديد</h2>
                      <button onClick={() => setView('store')} className="text-xs text-amber-600 font-bold">العودة للمتجر</button>
                    </div>
                    <form onSubmit={handleAddProduct} className="space-y-3">
                      <input type="text" placeholder="اسم المنتج" required value={newProd.name} onChange={e => setNewProd({...newProd, name: e.target.value})} className="w-full p-2.5 rounded-xl border text-xs" />
                      <div className="grid grid-cols-2 gap-2">
                        <input type="number" placeholder="السعر (ج.م)" required value={newProd.price} onChange={e => setNewProd({...newProd, price: e.target.value})} className="w-full p-2.5 rounded-xl border text-xs" />
                        <input type="number" placeholder="المخزون" value={newProd.stock} onChange={e => setNewProd({...newProd, stock: e.target.value})} className="w-full p-2.5 rounded-xl border text-xs" />
                      </div>
                      <input type="url" placeholder="رابط الصورة (URL)" value={newProd.image} onChange={e => setNewProd({...newProd, image: e.target.value})} className="w-full p-2.5 rounded-xl border text-xs" />
                      <textarea placeholder="وصف المنتج" rows="2" value={newProd.description} onChange={e => setNewProd({...newProd, description: e.target.value})} className="w-full p-2.5 rounded-xl border text-xs"></textarea>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">نشر بالسحابة فوراً 🚀</button>
                    </form>
                    <div className="space-y-2 mt-4 pt-4 border-t">
                      <h3 className="font-bold text-xs text-slate-600">المنتجات الحالية:</h3>
                      {products.map(p => (
                        <div key={p.id} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border text-xs">
                          <span>{p.name} ({p.price} ج.م)</span>
                          <button onClick={() => handleDelete(p.id)} className="bg-red-100 text-red-600 px-2 py-1 rounded-lg font-bold">حذف</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
          <footer className="mt-12 text-center text-[10px] text-slate-400">
            جميع الحقوق محفوظة © مكتب القزاز للبرمجيات
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
