<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر مكتب القزاز للبرمجيات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz4Vu2-04TRBOz4OaQy9Bq7XEge08hNfo",
      authDomain: "elkazzaz-store.firebaseapp.com",
      projectId: "elkazzaz-store",
      storageBucket: "elkazzaz-store.firebasestorage.app",
      messagingSenderId: "383296417502",
      appId: "1:383296417502:web:6de10a7f513b8148a81c4f",
      measurementId: "G-GB1YM2MVP9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firebaseFns = { collection, addDoc, deleteDoc, doc, onSnapshot };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <script type="text/babel">
    function App() {
      const [view, setView] = React.useState('store');
      const [products, setProducts] = React.useState([]);
      const [cart, setCart] = React.useState([]);
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [passInput, setPassInput] = React.useState('');
      const [adminPassword, setAdminPassword] = React.useState('admin123');
      const [newProd, setNewProd] = React.useState({ name: '', price: '', stock: '', category: 'إلكترونيات', image: '', description: '' });
      const [toast, setToast] = React.useState(null);
      const [isDbReady, setIsDbReady] = React.useState(false);

      const showMsg = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      React.useEffect(() => {
        const handleReady = () => {
          const db = window.db;
          const { collection, onSnapshot } = window.firebaseFns;

          onSnapshot(collection(db, 'products'), (snapshot) => {
            const prods = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            setProducts(prods);
          });

          setIsDbReady(true);
        };

        if (window.db) {
          handleReady();
        } else {
          window.addEventListener('firebase-ready', handleReady);
        }
      }, []);

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!newProd.name || !newProd.price) return;
        try {
          const { collection, addDoc } = window.firebaseFns;
          await addDoc(collection(window.db, 'products'), {
            name: newProd.name,
            price: Number(newProd.price),
            stock: Number(newProd.stock || 10),
            category: newProd.category,
            image: newProd.image || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&q=80',
            description: newProd.description
          });
          setNewProd({ name: '', price: '', stock: '', category: 'إلكترونيات', image: '', description: '' });
          showMsg('تم إضافة المنتج وتحديثه لحظياً على كافة الأجهزة!');
        } catch (err) {
          showMsg('خطأ أثناء الحفظ بالسحابة');
        }
      };

      const handleDelete = async (id) => {
        if (confirm('هل تريد حذف هذا المنتج؟')) {
          const { deleteDoc, doc } = window.firebaseFns;
          await deleteDoc(doc(window.db, 'products', id));
          showMsg('تم الحذف بنجاح');
        }
      };

      return (
        <div className="min-h-screen pb-16">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl animate-bounce">
              {toast}
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 p-4 shadow-sm">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div>
                <h1 className="font-bold text-slate-900 text-base md:text-lg">متجر مكتب القزاز للبرمجيات</h1>
                <p className="text-[11px] text-amber-600 font-medium">مزامنة سحابية لحظية | Firebase v13</p>
              </div>
              <button 
                onClick={() => setView(view === 'store' ? 'admin' : 'store')}
                className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-slate-800"
              >
                {view === 'store' ? '🔒 لوحة التحكم' : '🛍️ العرض للمشتري'}
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-4 mt-4">
            {!isDbReady ? (
              <div className="text-center py-20 text-slate-400 font-bold">جاري الاتصال بقاعدة بيانات السحابة...</div>
            ) : view === 'store' ? (
              <div>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-black text-slate-900">المنتجات المتاحة أونلاين</h2>
                  <span className="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">متصل بالسحابة 🟢</span>
                </div>

                {products.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm">
                    <p className="text-sm text-slate-500 mb-3">لا توجد منتجات مسجلة في المتجر حالياً.</p>
                    <button 
                      onClick={() => setView('admin')}
                      className="bg-amber-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md"
                    >
                      اضغط هنا لإضافة أول منتج عبر لوحة التحكم 🚀
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {products.map(p => (
                      <div key={p.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition-all flex flex-col justify-between">
                        <div>
                          <img src={p.image} className="w-full h-48 object-cover" />
                          <div className="p-4">
                            <span className="text-[10px] bg-amber-50 text-amber-700 px-2.5 py-1 rounded-md font-bold">{p.category}</span>
                            <h3 className="font-bold text-slate-900 text-base mt-2">{p.name}</h3>
                            <p className="text-xs text-slate-500 mt-1 line-clamp-2">{p.description}</p>
                          </div>
                        </div>
                        <div className="p-4 pt-0 flex items-center justify-between border-t border-slate-100 mt-2">
                          <span className="font-black text-amber-600 text-lg">{p.price} ج.م</span>
                          <button 
                            onClick={() => {
                              setCart([...cart, p]);
                              showMsg(`تمت إضافة ${p.name} للسلة`);
                            }}
                            className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md"
                          >
                            إضافة للسلة ({cart.filter(i => i.id === p.id).length})
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-3xl border border-slate-200 shadow-xl">
                {!isAdmin ? (
                  <div className="text-center py-8 space-y-4">
                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">🔐</div>
                    <h2 className="text-xl font-bold">دخول لوحة تحكم المدير</h2>
                    <p className="text-xs text-slate-400">كلمة السر الافتراضية: admin123</p>
                    <input 
                      type="password"
                      placeholder="أدخل كلمة السر..."
                      value={passInput}
                      onChange={e => setPassInput(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border text-center font-bold text-lg"
                    />
                    <button 
                      onClick={() => {
                        if (passInput === adminPassword) {
                          setIsAdmin(true);
                          showMsg('تم الدخول بنجاح');
                        } else {
                          showMsg('كلمة السر خاطئة!');
                        }
                      }}
                      className="w-full bg-amber-500 text-white font-bold py-3 rounded-xl shadow-lg"
                    >
                      تسجيل الدخول
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h2 className="font-bold text-lg text-slate-900">إدارة منتجات المتجر السحابي</h2>
                      <button onClick={() => setView('store')} className="text-xs text-amber-600 font-bold">العودة للمتجر</button>
                    </div>

                    <form onSubmit={handleAddProduct} className="space-y-3 bg-slate-50 p-4 rounded-2xl border">
                      <h3 className="font-bold text-xs text-amber-700">إضافة منتج جديد يظهر فوراً على كل الأجهزة</h3>
                      <input 
                        type="text" placeholder="اسم المنتج" required
                        value={newProd.name} onChange={e => setNewProd({...newProd, name: e.target.value})}
                        className="w-full p-2.5 rounded-xl border text-xs"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="number" placeholder="السعر (ج.م)" required
                          value={newProd.price} onChange={e => setNewProd({...newProd, price: e.target.value})}
                          className="w-full p-2.5 rounded-xl border text-xs"
                        />
                        <input 
                          type="number" placeholder="المخزون"
                          value={newProd.stock} onChange={e => setNewProd({...newProd, stock: e.target.value})}
                          className="w-full p-2.5 rounded-xl border text-xs"
                        />
                      </div>
                      <input 
                        type="url" placeholder="رابط صورة المنتج (URL)"
                        value={newProd.image} onChange={e => setNewProd({...newProd, image: e.target.value})}
                        className="w-full p-2.5 rounded-xl border text-xs"
                      />
                      <textarea 
                        placeholder="وصف المنتج..." rows="2"
                        value={newProd.description} onChange={e => setNewProd({...newProd, description: e.target.value})}
                        className="w-full p-2.5 rounded-xl border text-xs"
                      ></textarea>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">
                        نشر المنتج بالسحابة فوراً 🚀
                      </button>
                    </form>

                    <div className="space-y-2">
                      <h3 className="font-bold text-xs text-slate-600">المنتجات الحالية المسجلة سحابياً:</h3>
                      {products.map(p => (
                        <div key={p.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border text-xs">
                          <span className="font-bold">{p.name} - <span className="text-amber-600">{p.price} ج.م</span></span>
                          <button onClick={() => handleDelete(p.id)} className="bg-red-100 text-red-600 px-3 py-1 rounded-lg font-bold">حذف</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
          
          <footer className="mt-12 text-center text-[11px] text-slate-400">
            جميع الحقوق محفوظة © مكتب القزاز للبرمجيات | El-Qazzaz Software Office
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
