<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر مكتب القزاز للبرمجيات</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    // رابط Google Apps Script الخاص بك متضمن في الكود مباشرة
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVB5VDKe7ONxDDIJy8bHOfkctYk2wpfSX54yh3DVLr7twkImXZVkGqjbSTNdc13Knc/exec";

    function App() {
      const [view, setView] = React.useState('store');
      const [adminTab, setAdminTab] = React.useState('products');
      
      const [products, setProducts] = React.useState([]);
      const [cart, setCart] = React.useState([]);
      const [orders, setOrders] = React.useState([]);

      const [isAdmin, setIsAdmin] = React.useState(false);
      const [passInput, setPassInput] = React.useState('');
      
      const [settings, setSettings] = React.useState({
        storeName: 'متجر مكتب القزاز للبرمجيات',
        walletNumber: '01000000000',
        adminPassword: 'admin123',
        enableCash: true,
        enableVodafone: true,
        enableVisa: true
      });

      const [newProd, setNewProd] = React.useState({ name: '', price: '', stock: '', category: 'إلكترونيات وخَدَمات', image: '', description: '' });
      const [customer, setCustomer] = React.useState({ name: '', phone: '', address: '', notes: '', paymentMethod: 'vodafone', transactionId: '' });
      const [toast, setToast] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [isSyncing, setIsSyncing] = React.useState(false);

      const showMsg = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const loadDataFromSheet = async () => {
        try {
          const resProd = await fetch(`${SCRIPT_URL}?action=getProducts`);
          const dataProd = await resProd.json();
          if (dataProd.products) setProducts(dataProd.products);

          const resOrd = await fetch(`${SCRIPT_URL}?action=getOrders`);
          const dataOrd = await resOrd.json();
          if (dataOrd.orders) setOrders(dataOrd.orders);
        } catch (err) {
          console.error("Error loading data:", err);
        } finally {
          setLoading(false);
        }
      };

      React.useEffect(() => {
        loadDataFromSheet();
      }, []);

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!newProd.name || !newProd.price) {
          showMsg('يرجى إدخال اسم المنتج والسعر على الأقل');
          return;
        }

        setIsSyncing(true);
        const productData = {
          name: newProd.name.trim(),
          price: Number(newProd.price),
          stock: Number(newProd.stock || 10),
          category: newProd.category,
          image: newProd.image.trim() || 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&q=80',
          description: newProd.description.trim(),
          createdAt: new Date().toISOString()
        };

        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'addProduct', product: productData })
          });
          setNewProd({ name: '', price: '', stock: '', category: 'إلكترونيات وخَدَمات', image: '', description: '' });
          showMsg('تم الحفظ في Google Sheets بنجاح 🚀');
          await loadDataFromSheet();
        } catch (err) {
          showMsg('فشل الحفظ: ' + err.message);
        } finally {
          setIsSyncing(false);
        }
      };

      const handleDelete = async (id) => {
        if (confirm('هل تريد حذف هذا المنتج نهائياً من Google Sheets؟')) {
          setIsSyncing(true);
          try {
            await fetch(SCRIPT_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'deleteProduct', id: id })
            });
            showMsg('تم الحذف بنجاح');
            await loadDataFromSheet();
          } catch (err) {
            showMsg('فشل الحذف: ' + err.message);
          } finally {
            setIsSyncing(false);
          }
        }
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      const handleCheckoutSubmit = async (e) => {
        e.preventDefault();
        if (!customer.name || !customer.phone || !customer.address) {
          showMsg('يرجى إكمال بيانات الشحن (الاسم، الهاتف، العنوان)');
          return;
        }

        if (customer.paymentMethod === 'vodafone' && !customer.transactionId) {
          showMsg('يرجى كتابة رقم العملية أو رقم المحفظة المحول منها');
          return;
        }

        setIsSyncing(true);
        const orderData = {
          customerName: customer.name.trim(),
          phone: customer.phone.trim(),
          address: customer.address.trim(),
          notes: customer.notes.trim(),
          paymentMethod: customer.paymentMethod,
          transactionId: customer.transactionId || 'N/A',
          items: cart,
          total: totalPrice,
          date: new Date().toLocaleString('ar-EG')
        };

        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'addOrder', order: orderData })
          });

          showMsg('تم تسجيل الشراء بنجاح وتوثيقه في Google Sheets! 🎉');
          setTimeout(() => {
            setCart([]);
            setCustomer({ name: '', phone: '', address: '', notes: '', paymentMethod: 'vodafone', transactionId: '' });
            setView('store');
          }, 2000);
          await loadDataFromSheet();
        } catch (err) {
          showMsg('حدث خطأ أثناء حفظ الطلب: ' + err.message);
        } finally {
          setIsSyncing(false);
        }
      };

      return (
        <div className="min-h-screen pb-16">
          {toast && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-bold shadow-2xl">
              {toast}
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 p-4 shadow-sm">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <div>
                <h1 className="font-bold text-slate-900 text-base">{settings.storeName}</h1>
                <p className="text-[11px] text-emerald-600 font-medium">
                  {isSyncing ? 'جاري مزامنة شيت جوجل 🔄' : 'مربوط بسحابة Google Sheets 📊 🟢'}
                </p>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setView('cart')}
                  className="bg-amber-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md"
                >
                  🛒 السلة ({cart.length})
                </button>
                <button 
                  onClick={() => setView(view === 'admin' ? 'store' : 'admin')}
                  className="bg-slate-900 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-slate-800"
                >
                  {view === 'admin' ? '🛍️ المتجر' : '🔒 لوحة التحكم'}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-4 mt-4">
            {loading ? (
              <div className="text-center py-20 text-slate-400 font-bold text-sm">جاري جلب البيانات من Google Sheets...</div>
            ) : view === 'store' ? (
              <div>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-black text-slate-900">المنتجات المتاحة أونلاين</h2>
                  <span className="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-bold">إجمالي المنتجات: {products.length}</span>
                </div>

                {products.length === 0 ? (
                  <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 shadow-sm">
                    <p className="text-sm text-slate-500 mb-3">لا توجد منتجات مسجلة حالياً.</p>
                    <button 
                      onClick={() => setView('admin')}
                      className="bg-amber-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md"
                    >
                      الانتقال للوحة التحكم وإضافة أول منتج 🚀
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {products.map(p => (
                      <div key={p.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition-all flex flex-col justify-between">
                        <div>
                          <img src={p.image} className="w-full h-48 object-cover" />
                          <div className="p-4">
                            <span className="text-[10px] bg-amber-50 text-amber-700 px-2.5 py-1 rounded-md font-bold">{p.category}</span>
                            <h3 className="font-bold text-slate-900 text-base mt-2">{p.name}</h3>
                            <p className="text-xs text-slate-500 mt-1 line-clamp-2">{p.description}</p>
                          </div>
                        </div>
                        <div className="p-4 pt-0 flex items-center justify-between border-t border-slate-100 mt-2">
                          <span className="font-black text-amber-600 text-lg">{p.price} ج.م</span>
                          <button 
                            onClick={() => {
                              setCart([...cart, p]);
                              showMsg(`تمت إضافة ${p.name} للسلة`);
                            }}
                            className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md"
                          >
                            إضافة للسلة
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : view === 'cart' ? (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-3xl border border-slate-200 shadow-xl space-y-6">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="font-bold text-lg text-slate-900">سلة المشتريات</h2>
                  <button onClick={() => setView('store')} className="text-xs text-amber-600 font-bold">تابع الشراء 🛍️</button>
                </div>

                {cart.length === 0 ? (
                  <div className="text-center py-12 text-slate-400">
                    <p className="text-sm">سلة المشتريات فارغة حالياً.</p>
                    <button onClick={() => setView('store')} className="mt-4 bg-amber-500 text-white px-4 py-2 rounded-xl text-xs font-bold">تصفح المنتجات</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="divide-y max-h-60 overflow-y-auto">
                      {cart.map((item, index) => (
                        <div key={index} className="py-3 flex justify-between items-center text-xs">
                          <div>
                            <span className="font-bold text-slate-900">{item.name}</span>
                            <span className="text-slate-400 block">{item.price} ج.م</span>
                          </div>
                          <button 
                            onClick={() => {
                              const updatedCart = cart.filter((_, i) => i !== index);
                              setCart(updatedCart);
                            }}
                            className="text-red-500 font-bold text-xs bg-red-50 px-2.5 py-1 rounded-lg"
                          >
                            حذف
                          </button>
                        </div>
                      ))}
                    </div>

                    <div className="border-t pt-4 flex justify-between items-center font-black text-base">
                      <span>إجمالي الطلب:</span>
                      <span className="text-amber-600">{totalPrice} ج.م</span>
                    </div>

                    <button 
                      onClick={() => setView('checkout')}
                      className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg"
                    >
                      الانتقال لشاشة الدفع وتأكيد الطلب 💳
                    </button>
                  </div>
                )}
              </div>
            ) : view === 'checkout' ? (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-3xl border border-slate-200 shadow-xl space-y-6">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="font-bold text-lg text-slate-900">إتمام الشراء والدفع أونلاين</h2>
                  <button onClick={() => setView('cart')} className="text-xs text-amber-600 font-bold">العودة للسلة</button>
                </div>

                <form onSubmit={handleCheckoutSubmit} className="space-y-4">
                  <div className="space-y-3">
                    <h3 className="font-bold text-xs text-slate-700">1. بيانات الشحن والاستلام</h3>
                    <input 
                      type="text" required placeholder="الاسم الكامل"
                      value={customer.name} onChange={e => setCustomer({...customer, name: e.target.value})}
                      className="w-full p-2.5 rounded-xl border text-xs"
                    />
                    <input 
                      type="tel" required placeholder="رقم الهاتف (للتواصل)"
                      value={customer.phone} onChange={e => setCustomer({...customer, phone: e.target.value})}
                      className="w-full p-2.5 rounded-xl border text-xs"
                    />
                    <textarea 
                      required placeholder="عنوان الاستلام بالتفصيل..." rows="2"
                      value={customer.address} onChange={e => setCustomer({...customer, address: e.target.value})}
                      className="w-full p-2.5 rounded-xl border text-xs"
                    ></textarea>
                  </div>

                  <div className="space-y-3 pt-3 border-t">
                    <h3 className="font-bold text-xs text-slate-700">2. اختر طريقة الدفع الأونلاين</h3>
                    
                    <div className="grid grid-cols-1 gap-2">
                      <label className={`p-3 border rounded-xl flex items-center justify-between cursor-pointer ${customer.paymentMethod === 'vodafone' ? 'border-amber-500 bg-amber-50' : 'bg-slate-50'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" name="payment" value="vodafone"
                            checked={customer.paymentMethod === 'vodafone'}
                            onChange={e => setCustomer({...customer, paymentMethod: e.target.value})}
                          />
                          <span className="text-xs font-bold text-slate-800">محفظة إلكترونية (فودافون كاش / أورنج / اتصالات)</span>
                        </div>
                        <span className="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">كاش 📱</span>
                      </label>

                      <label className={`p-3 border rounded-xl flex items-center justify-between cursor-pointer ${customer.paymentMethod === 'cash' ? 'border-amber-500 bg-amber-50' : 'bg-slate-50'}`}>
                        <div className="flex items-center gap-2">
                          <input 
                            type="radio" name="payment" value="cash"
                            checked={customer.paymentMethod === 'cash'}
                            onChange={e => setCustomer({...customer, paymentMethod: e.target.value})}
                          />
                          <span className="text-xs font-bold text-slate-800">الدفع نقداً عند الاستلام</span>
                        </div>
                        <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold">COD 💵</span>
                      </label>
                    </div>

                    {customer.paymentMethod === 'vodafone' && (
                      <div className="p-3 bg-red-50 border border-red-200 rounded-xl space-y-2 text-xs text-red-900">
                        <p className="font-bold">برجاء تحويل مبلغ <span className="text-base text-red-600">{totalPrice} ج.م</span> إلى رقم المحفظة التالي:</p>
                        <div className="bg-white p-2 rounded-lg text-center font-black text-lg tracking-wider border border-red-300 select-all">
                          {settings.walletNumber}
                        </div>
                        <input 
                          type="text" required placeholder="أدخل رقم المحفظة المحول منها أو رقم عملية التحويل..."
                          value={customer.transactionId} onChange={e => setCustomer({...customer, transactionId: e.target.value})}
                          className="w-full p-2 rounded-lg border text-xs bg-white text-slate-800"
                        />
                      </div>
                    )}
                  </div>

                  <div className="bg-slate-50 p-4 rounded-2xl border flex justify-between items-center text-sm font-black">
                    <span>إجمالي المبلغ المطلوب:</span>
                    <span className="text-amber-600">{totalPrice} ج.م</span>
                  </div>

                  <button 
                    type="submit" disabled={isSyncing}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow-lg disabled:opacity-50"
                  >
                    {isSyncing ? 'جاري الحفظ في شيت جوجل...' : 'تأكيد الطلب والدفع 🚀'}
                  </button>
                </form>
              </div>
            ) : (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-3xl border border-slate-200 shadow-xl">
                {!isAdmin ? (
                  <div className="text-center py-8 space-y-4">
                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl">🔐</div>
                    <h2 className="text-xl font-bold">دخول لوحة تحكم المدير</h2>
                    <input 
                      type="password"
                      placeholder="أدخل كلمة السر..."
                      value={passInput}
                      onChange={e => setPassInput(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border text-center font-bold text-lg focus:outline-none focus:border-amber-500"
                    />
                    <button 
                      onClick={() => {
                        if (passInput === settings.adminPassword) {
                          setIsAdmin(true);
                          showMsg('تم تسجيل الدخول بنجاح');
                        } else {
                          showMsg('كلمة السر خاطئة!');
                        }
                      }}
                      className="w-full bg-amber-500 text-white font-bold py-3 rounded-lg shadow-lg"
                    >
                      تسجيل الدخول
                    </button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center border-b pb-3">
                      <h2 className="font-bold text-lg text-slate-900">لوحة التحكم الإدارية</h2>
                      <button onClick={() => setView('store')} className="text-xs text-amber-600 font-bold">العودة للمتجر 🛍️</button>
                    </div>

                    <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                      <button 
                        onClick={() => setAdminTab('products')} 
                        className={`flex-1 py-2 rounded-lg transition-all ${adminTab === 'products' ? 'bg-white shadow-sm text-amber-600' : 'text-slate-500'}`}
                      >
                        📦 المنتجات ({products.length})
                      </button>
                      <button 
                        onClick={() => setAdminTab('orders')} 
                        className={`flex-1 py-2 rounded-lg transition-all ${adminTab === 'orders' ? 'bg-white shadow-sm text-amber-600' : 'text-slate-500'}`}
                      >
                        📋 الطلبات الواردة ({orders.length})
                      </button>
                    </div>

                    {adminTab === 'products' && (
                      <div className="space-y-4">
                        <form onSubmit={handleAddProduct} className="space-y-3 bg-slate-50 p-4 rounded-2xl border">
                          <h3 className="font-bold text-xs text-amber-700">إضافة منتج جديد لـ Google Sheets</h3>
                          <input 
                            type="text" placeholder="اسم المنتج" required
                            value={newProd.name} onChange={e => setNewProd({...newProd, name: e.target.value})}
                            className="w-full p-2.5 rounded-xl border text-xs"
                          />
                          <div className="grid grid-cols-2 gap-2">
                            <input 
                              type="number" placeholder="السعر (ج.م)" required
                              value={newProd.price} onChange={e => setNewProd({...newProd, price: e.target.value})}
                              className="w-full p-2.5 rounded-xl border text-xs"
                            />
                            <input 
                              type="number" placeholder="المخزون"
                              value={newProd.stock} onChange={e => setNewProd({...newProd, stock: e.target.value})}
                              className="w-full p-2.5 rounded-xl border text-xs"
                            />
                          </div>
                          <input 
                            type="url" placeholder="رابط صورة المنتج (URL)"
                            value={newProd.image} onChange={e => setNewProd({...newProd, image: e.target.value})}
                            className="w-full p-2.5 rounded-xl border text-xs"
                          />
                          <textarea 
                            placeholder="وصف المنتج..." rows="2"
                            value={newProd.description} onChange={e => setNewProd({...newProd, description: e.target.value})}
                            className="w-full p-2.5 rounded-xl border text-xs"
                          ></textarea>
                          <button type="submit" disabled={isSyncing} className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-md disabled:opacity-50">
                            {isSyncing ? 'جاري الحفظ...' : 'نشر المنتج في شيت جوجل 🚀'}
                          </button>
                        </form>

                        <div className="space-y-2">
                          <h3 className="font-bold text-xs text-slate-600">المنتجات المسجلة في شيت جوجل:</h3>
                          {products.map(p => (
                            <div key={p.id} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border text-xs">
                              <span className="font-bold">{p.name} - <span className="text-amber-600">{p.price} ج.م</span></span>
                              <button onClick={() => handleDelete(p.id)} className="bg-red-100 text-red-600 px-2.5 py-1 rounded-lg font-bold">حذف</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {adminTab === 'orders' && (
                      <div className="space-y-3">
                        <h3 className="font-bold text-xs text-slate-900">طلبات العملاء الواردة من شيت جوجل ({orders.length}):</h3>
                        {orders.length === 0 ? (
                          <p className="text-xs text-slate-400">لا توجد طلبات جديدة حتى الآن.</p>
                        ) : (
                          orders.map(ord => (
                            <div key={ord.id} className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs space-y-1">
                              <div className="flex justify-between font-bold text-slate-900">
                                <span>{ord.customerName} ({ord.phone})</span>
                                <span className="text-amber-700">{ord.total} ج.م</span>
                              </div>
                              <p className="text-slate-600">العنوان: {ord.address}</p>
                              <p className="text-slate-600">طريقة الدفع: <span className="font-bold">{ord.paymentMethod}</span></p>
                              {ord.transactionId !== 'N/A' && <p className="text-slate-600 font-bold">رقم تحويل المحفظة: {ord.transactionId}</p>}
                              <p className="text-[10px] text-slate-400">التاريخ: {ord.date}</p>
                            </div>
                          ))
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>
          
          <footer className="mt-12 text-center text-[11px] text-slate-400">
            جميع الحقوق محفوظة © متجر مكتب القزاز للبرمجيات | El-Qazzaz Software Office
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
